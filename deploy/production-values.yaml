# Provider-neutral production starting point. The released chart selects its
# matching controller, runner, and worker images automatically. Override only
# environment-owned storage, registry, capacity, and scheduling inputs.

imagePullSecrets:
  # Set name to an existing pull secret, or set create=true with
  # imageRegistries entries to let the chart create one.
  create: false
  name: ""

imageRegistries: []

observability:
  enabled: false
  controllerServiceName: kova-controller
  runnerServiceName: kova-runner
  endpoint: ""
  insecure: true
  resourceAttributes: {}
  metricInterval: 15s
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: false

artifactStore:
  driver: s3
  secretName: kova-artifact-credentials
  credentials:
    provider: file
    mountPath: /var/run/secrets/kova/s3
  s3:
    endpoint: objects.example.com
    bucket: kova-builds
    region: us-east-1
    secure: true

serviceDaemon:
  enabled: true
  replicas: 2
  authentication:
    mode: tokenreview
  resources: {}

deployment:
  replicas: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

worker:
  resources:
    limits:
      ephemeral-storage: 80Gi
      # cpu: 16
      # memory: 32Gi
    requests:
      ephemeral-storage: 40Gi
      # cpu: 8
      # memory: 16Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
  metrics: []

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

affinity: {}

scheduling:
  singlePodPerNode: false
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

buildkitdConfig: |
  debug = false
