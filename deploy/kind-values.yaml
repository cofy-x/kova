images:
  controller:
    repository: localhost:5002/kova
    tag: controller-dev
    pullPolicy: IfNotPresent
  runner:
    repository: localhost:5002/kova
    tag: runner-dev
    pullPolicy: IfNotPresent
  worker:
    repository: localhost:5002/kova
    tag: worker-dev
    pullPolicy: IfNotPresent

imagePullSecrets:
  create: false
  name: ""

imageRegistries: []

# kindnet's NetworkPolicy implementation can drop UDP DNS replies to selected
# rootless worker Pods. Production overlays keep the chart's secure default.
networkPolicy:
  worker:
    enabled: false

observability:
  enabled: true
  controllerServiceName: kova-controller
  runnerServiceName: kova-runner
  endpoint: host.docker.internal:14317
  insecure: true
  resourceAttributes:
    deployment.environment: kind
  metricInterval: 5s
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true

deployment:
  replicas: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

worker:
  resources:
    limits:
      ephemeral-storage: 8Gi
    requests:
      ephemeral-storage: 1Gi
  volumes:
    - name: run-buildkit
      emptyDir: {}
    - name: lib-buildkit
      emptyDir:
        sizeLimit: 8Gi
  volumeMounts:
    - name: run-buildkit
      mountPath: /run/user/1000
    - name: lib-buildkit
      mountPath: /home/user/.local/share/buildkit
    - name: buildkit-config
      mountPath: /etc/buildkit

affinity:
  nodeAffinity: null

scheduling:
  singlePodPerNode: true
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

buildkitdConfig: |
  debug = false

  [registry."kind-registry:5000"]
    http = true
