name: kova-observability

services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.16
    ports:
      - "${KOVA_LOCAL_GRAFANA_PORT:-30301}:3000"
      - "${KOVA_LOCAL_OTLP_GRPC_PORT:-14317}:4317"
      - "${KOVA_LOCAL_OTLP_HTTP_PORT:-14318}:4318"
      - "${KOVA_LOCAL_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./grafana/provisioning/dashboards/kova.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kova.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/dashboards:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/health]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    restart: unless-stopped
