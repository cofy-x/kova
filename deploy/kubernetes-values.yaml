# Baseline for production Kubernetes deployments. Override the image,
# credentials, resources, scheduling, and registry configuration for the target
# environment.

images:
  controller:
    repository: registry.example.com/kova
    tag: controller-dev
    pullPolicy: IfNotPresent
  runner:
    repository: registry.example.com/kova
    tag: runner-dev
    pullPolicy: IfNotPresent
  worker:
    repository: registry.example.com/kova
    tag: worker-dev
    pullPolicy: IfNotPresent

imagePullSecrets:
  # Set name to an existing pull secret, or set create=true with
  # imageRegistries entries to let the chart create one.
  create: false
  name: ""

imageRegistries: []

observability:
  enabled: false
  controllerServiceName: kova-controller
  runnerServiceName: kova-runner
  endpoint: ""
  insecure: true
  resourceAttributes: {}
  metricInterval: 15s
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: false

deployment:
  replicas: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

worker:
  resources:
    limits:
      ephemeral-storage: 80Gi
      # cpu: 16
      # memory: 32Gi
    requests:
      ephemeral-storage: 40Gi
      # cpu: 8
      # memory: 16Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
  metrics: []

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

affinity: {}

scheduling:
  singlePodPerNode: false
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

buildkitdConfig: |
  debug = false
