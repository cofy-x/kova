namespaceOverride: ""

images:
  controller:
    repository: ghcr.io/cofy-x/kova
    # Empty uses controller-<Chart.appVersion>.
    tag: ""
    # Optional OCI manifest digest; when set, takes precedence over tag.
    digest: ""
    pullPolicy: IfNotPresent
  runner:
    repository: ghcr.io/cofy-x/kova
    # Empty uses runner-<Chart.appVersion>.
    tag: ""
    # Required for Service: exact OCI manifest/index digest pinned in Genesis.
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/cofy-x/kova
    # Empty uses worker-<Chart.appVersion>.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  create: false
  name: ""

imageRegistries: []

observability:
  enabled: false
  controllerServiceName: kova-controller
  runnerServiceName: kova-runner
  endpoint: ""
  insecure: true
  resourceAttributes: {}
  metricInterval: 15s
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 9094
  targetPort: tcp
  clusterIP: None
  clusterIPs:
    - None
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinity: None

serviceDaemon:
  enabled: false
  # Zero stages an upgrade with the controller stopped; restore a positive
  # count after the CRD and drain gates pass.
  replicas: 1
  listen: ":8080"
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  authentication:
    mode: tokenreview
    staticTokenSecret:
      name: ""
      key: token
    staticPrincipal: kova:static
  jobTTL: 2h
  wait: 3m
  pollInterval: 5s
  pollRetryWindow: 1m
  maxBuildDuration: 2h
  verificationAttemptTimeout: 10s
  verificationWindow: 5m
  maxActiveJobs: 20
  maxActiveJobsPerRequester: 4
  maxQueuedJobs: 1000
  maxQueuedJobsPerRequester: 100
  workerSlots: 20
  # External capacity-domain identity, not derived from mutable endpoints.
  workerPoolID: ""
  # Opt-in only after an external installer has created a new runner Namespace,
  # Initializing Genesis, and immutable receipt Secret. Kova never creates the
  # receipt Secret or Genesis from these values.
  admissionGenesis:
    enabled: false
    # Externally created, fresh receipt-only Namespace. Its original UID is
    # pinned inside the immutable Genesis/Secret contract, not learned by Helm.
    recoveryReceiptNamespace: ""
    receiptSecret:
      name: ""
      # Record the original Secret UID after external creation. A replacement
      # at the same name must never become the Service's authority.
      uid: ""
  controllerConcurrency: 4
  # Each Service Pod gives build-controller and HTTP admission independent
  # Kubernetes REST budgets at these values. Lease renewal and readiness
  # retain separate small budgets. Budget the sum across all replicas.
  kubeClientQPS: 20
  kubeClientBurst: 40
  # Disabled unless explicitly enabled for a controlled diagnostic run.
  # Loopback-only: never expose unauthenticated controller metrics by Service.
  metricsBindAddress: "0"
  leaderElect: true
  runnerNamespace: ""
  runnerImagePullSecret: ""
  # Optional Docker config Secret used by the controller to verify pushed
  # image descriptors. Defaults to runnerImagePullSecret, then imagePullSecrets.
  registrySecret: ""
  # Registry hosts that intentionally use plain HTTP. Development only.
  registryPlainHTTP: []
  runnerNodeSelector: {}
  # These limits apply to each short-lived runner Pod, not the Service Pod.
  runnerResources:
    requests:
      cpu: 100m
      memory: 2Gi
      ephemeral-storage: 5Gi
    limits:
      cpu: "4"
      memory: 2Gi
      ephemeral-storage: 5Gi
  sourceFetchResources:
    requests:
      cpu: 50m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
      ephemeral-storage: 1Gi
  # Also contains runner /tmp, including the upload copy and extracted source.
  sourceVolumeSizeLimit: 4Gi
  # Explicit platform-to-BuildKit worker Service mappings. Empty maps the
  # local worker.platform to this release's headless Service.
  buildkitPlatformAddrs: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

networkPolicy:
  worker:
    # Rootless BuildKit has no application-layer authentication. Restrict its
    # TCP endpoint to Kova runner Pods by default.
    enabled: true
    additionalIngressFrom: []
  service:
    # Service ingress varies by cluster gateway and is opt-in. An empty peer
    # list intentionally denies all ingress when enabled.
    enabled: false
    ingressFrom: []

worker:
  # One worker release serves exactly one platform. Install additional
  # worker releases and map their Services above when both are required.
  platform: linux/amd64
  cache:
    # Absolute BuildKit GC budgets, independent of the node filesystem size.
    # maxUsedSpaceGB must leave headroom below the cache emptyDir and worker
    # ephemeral-storage limit; GC cannot reclaim active build references.
    reservedSpaceGB: 2
    maxUsedSpaceGB: 8
    minFreeSpaceGB: 2
  name: buildkitd
  args:
    - --config
    - /etc/buildkit/buildkitd.toml
    - --addr
    - tcp://0.0.0.0:9094
    - --oci-worker-no-process-sandbox
  portName: tcp
  port: 9094
  protocol: TCP
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: Unconfined
    appArmorProfile:
      type: Unconfined
  livenessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 15
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 3
  readinessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3

  resources:
    limits:
      ephemeral-storage: 20Gi
      # cpu: 16
      # memory: 32Gi
    requests:
      ephemeral-storage: 1Gi
      # cpu: 16
      # memory: 32Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  volumes:
    - name: run-buildkit
      emptyDir: {}
    - name: lib-buildkit
      emptyDir:
        sizeLimit: 20Gi
  volumeMounts:
    - name: run-buildkit
      mountPath: /run/user/1000
    - name: lib-buildkit
      mountPath: /home/user/.local/share/buildkit
    - name: buildkit-config
      mountPath: /etc/buildkit

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
hostAliases: []

affinity: {}

scheduling:
  singlePodPerNode: false
  topologySpread:
    enabled: false
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
  metrics: []

extraVolumes: []
extraVolumeMounts: []

buildkitdConfig: |
  debug = false

deployment:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

podAnnotations: {}
podLabels: {}
restartPolicy: Always
dnsPolicy: ClusterFirst
schedulerName: default-scheduler
terminationGracePeriodSeconds: 30
terminationMessagePath: /dev/termination-log
terminationMessagePolicy: File
