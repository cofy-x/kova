namespaceOverride: ""

images:
  controller:
    repository: ghcr.io/cofy-x/kova
    # Empty uses controller-<Chart.appVersion>.
    tag: ""
    pullPolicy: IfNotPresent
  runner:
    repository: ghcr.io/cofy-x/kova
    # Empty uses runner-<Chart.appVersion>.
    tag: ""
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/cofy-x/kova
    # Empty uses worker-<Chart.appVersion>.
    tag: ""
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  create: false
  name: ""

imageRegistries: []

observability:
  enabled: false
  controllerServiceName: kova-controller
  runnerServiceName: kova-runner
  endpoint: ""
  insecure: true
  resourceAttributes: {}
  metricInterval: 15s
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 9094
  targetPort: tcp
  clusterIP: None
  clusterIPs:
    - None
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinity: None

artifactStore:
  driver: filesystem
  # Secret keys use the KOVA_S3_* environment variable names. The same Secret
  # is exposed to the controller and S3 source-fetch init containers.
  secretName: ""
  filesystem:
    mountPath: /var/lib/kova/artifacts
    pvc:
      create: false
      existingClaim: ""
      name: ""
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 10Gi
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    secure: true

serviceDaemon:
  enabled: false
  replicas: 1
  listen: ":8080"
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  authentication:
    mode: tokenreview
    staticTokenSecret:
      name: ""
      key: token
    staticPrincipal: kova:static
  jobTTL: 2h
  maxUploadBytes: 1073741824
  wait: 3m
  pollInterval: 5s
  maxActiveJobs: 20
  workerSlots: 20
  leaderElect: true
  runnerNamespace: ""
  runnerImagePullSecret: ""
  # Optional Docker config Secret used by the controller to verify pushed
  # image descriptors. Defaults to runnerImagePullSecret, then imagePullSecrets.
  registrySecret: ""
  # Registry hosts that intentionally use plain HTTP. Development only.
  registryPlainHTTP: []
  # A filesystem store backed by ReadWriteOnce storage may require pinning the
  # controller and runner Pods to the same node. S3 storage needs no pinning.
  runnerNodeSelector: {}
  buildkitAddr: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

networkPolicy:
  enabled: false
  # Empty peer lists deny ingress to the selected component. Supply standard
  # Kubernetes NetworkPolicyPeer entries for the namespaces and Pods that may
  # reach each endpoint.
  workerIngressFrom: []
  serviceIngressFrom: []

worker:
  name: buildkitd
  args:
    - --config
    - /etc/buildkit/buildkitd.toml
    - --addr
    - tcp://0.0.0.0:9094
    - --oci-worker-no-process-sandbox
  portName: tcp
  port: 9094
  protocol: TCP
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: Unconfined
    appArmorProfile:
      type: Unconfined
  livenessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 15
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 3
  readinessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3

  resources:
    limits:
      ephemeral-storage: 20Gi
      # cpu: 16
      # memory: 32Gi
    requests:
      ephemeral-storage: 1Gi
      # cpu: 16
      # memory: 32Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  volumes:
    - name: run-buildkit
      emptyDir: {}
    - name: lib-buildkit
      emptyDir:
        sizeLimit: 20Gi
  volumeMounts:
    - name: run-buildkit
      mountPath: /run/user/1000
    - name: lib-buildkit
      mountPath: /home/user/.local/share/buildkit
    - name: buildkit-config
      mountPath: /etc/buildkit

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
hostAliases: []

affinity: {}

scheduling:
  singlePodPerNode: false
  topologySpread:
    enabled: false
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
  metrics: []

extraVolumes: []
extraVolumeMounts: []

buildkitdConfig: |
  debug = false

deployment:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

podAnnotations: {}
podLabels: {}
restartPolicy: Always
dnsPolicy: ClusterFirst
schedulerName: default-scheduler
terminationGracePeriodSeconds: 30
terminationMessagePath: /dev/termination-log
terminationMessagePolicy: File
