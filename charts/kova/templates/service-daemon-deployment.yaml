{{- if .Values.serviceDaemon.enabled }}
{{- if not (has .Values.artifactStore.driver (list "filesystem" "s3")) }}
{{- fail "artifactStore.driver must be filesystem or s3" }}
{{- end }}
{{- if not (has .Values.serviceDaemon.authentication.mode (list "tokenreview" "static" "unsafe-none")) }}
{{- fail "serviceDaemon.authentication.mode must be tokenreview, static, or unsafe-none" }}
{{- end }}
{{- if and (eq .Values.artifactStore.driver "filesystem") (not .Values.artifactStore.filesystem.pvc.create) (not .Values.artifactStore.filesystem.pvc.existingClaim) }}
{{- fail "artifactStore.filesystem.pvc.existingClaim is required when the chart does not create the filesystem PVC" }}
{{- end }}
{{- $name := printf "%s-service" (include "kova.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $selectorName := printf "%s-service" (include "kova.name" .) | trunc 63 | trimSuffix "-" }}
{{- $saName := default "default" .Values.serviceDaemon.serviceAccount.name }}
{{- if .Values.serviceDaemon.serviceAccount.create }}
{{- $saName = default $name .Values.serviceDaemon.serviceAccount.name }}
{{- end }}
{{- $runnerRegistrySecret := default (include "kova.imagePullSecretName" .) .Values.serviceDaemon.runnerImagePullSecret }}
{{- $outputRegistrySecret := default $runnerRegistrySecret .Values.serviceDaemon.registrySecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "kova.namespace" . }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.serviceDaemon.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ $selectorName }}
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ $selectorName }}
        app.kubernetes.io/component: service
        {{- with .Values.serviceDaemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.serviceDaemon.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceDaemon.serviceAccount.automountServiceAccountToken }}
      serviceAccountName: {{ $saName }}
      securityContext:
        {{- toYaml .Values.serviceDaemon.podSecurityContext | nindent 8 }}
      containers:
        - name: kova-service
          image: {{ include "kova.roleImage" (dict "root" . "role" "controller") | quote }}
          imagePullPolicy: {{ include "kova.roleImagePullPolicy" (dict "root" . "role" "controller") }}
          args:
            - --listen={{ .Values.serviceDaemon.listen }}
            - --namespace={{ default (include "kova.namespace" .) .Values.serviceDaemon.runnerNamespace }}
            - --runner-image={{ include "kova.roleImage" (dict "root" . "role" "runner") }}
            - --runner-image-pull-policy={{ include "kova.roleImagePullPolicy" (dict "root" . "role" "runner") }}
            - --runner-image-pull-secret={{ $runnerRegistrySecret }}
            {{- range $key, $value := .Values.serviceDaemon.runnerNodeSelector }}
            - {{ printf "--runner-node-selector=%s=%s" $key ($value | toString) | quote }}
            {{- end }}
            {{- range .Values.serviceDaemon.registryPlainHTTP }}
            - {{ printf "--registry-plain-http=%s" . | quote }}
            {{- end }}
            - --buildkit-addr={{ default (printf "tcp://%s.%s.svc:%v" (include "kova.fullname" .) (include "kova.namespace" .) .Values.service.port) .Values.serviceDaemon.buildkitAddr }}
            - --artifact-driver={{ .Values.artifactStore.driver }}
            - --artifact-root={{ .Values.artifactStore.filesystem.mountPath }}
            - --artifact-secret={{ .Values.artifactStore.secretName }}
            {{- if eq .Values.artifactStore.driver "filesystem" }}
            - --source-pvc-claim={{ include "kova.sourcePVCName" . }}
            {{- else if eq .Values.artifactStore.driver "s3" }}
            - --s3-endpoint={{ required "artifactStore.s3.endpoint is required for the s3 driver" .Values.artifactStore.s3.endpoint }}
            - --s3-bucket={{ required "artifactStore.s3.bucket is required for the s3 driver" .Values.artifactStore.s3.bucket }}
            - --s3-region={{ .Values.artifactStore.s3.region }}
            - --s3-secure={{ .Values.artifactStore.s3.secure }}
            {{- end }}
            - --auth-mode={{ .Values.serviceDaemon.authentication.mode }}
            - --auth-static-principal={{ .Values.serviceDaemon.authentication.staticPrincipal }}
            - --job-ttl={{ .Values.serviceDaemon.jobTTL }}
            - --max-upload-bytes={{ .Values.serviceDaemon.maxUploadBytes | int64 }}
            - --max-log-bytes={{ .Values.serviceDaemon.maxLogBytes | int64 }}
            - --artifact-gc-interval={{ .Values.serviceDaemon.artifactGCInterval }}
            - --artifact-orphan-ttl={{ .Values.serviceDaemon.artifactOrphanTTL }}
            - --wait={{ .Values.serviceDaemon.wait }}
            - --poll-interval={{ .Values.serviceDaemon.pollInterval }}
            - --max-active-jobs={{ .Values.serviceDaemon.maxActiveJobs }}
            - --max-active-jobs-per-requester={{ .Values.serviceDaemon.maxActiveJobsPerRequester }}
            - --max-queued-jobs-per-requester={{ .Values.serviceDaemon.maxQueuedJobsPerRequester }}
            - --worker-slots={{ .Values.serviceDaemon.workerSlots }}
            - --leader-elect={{ .Values.serviceDaemon.leaderElect }}
            - --leader-election-namespace={{ include "kova.namespace" . }}
          ports:
            - name: http
              containerPort: {{ .Values.serviceDaemon.port }}
              protocol: TCP
          {{- if or .Values.observability.enabled (eq .Values.serviceDaemon.authentication.mode "static") $outputRegistrySecret }}
          env:
            {{- if .Values.observability.enabled }}
            {{- include "kova.observabilityEnv" . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.serviceDaemon.authentication.mode "static" }}
            - name: KOVA_SERVICE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "serviceDaemon.authentication.staticTokenSecret.name is required for static authentication" .Values.serviceDaemon.authentication.staticTokenSecret.name }}
                  key: {{ .Values.serviceDaemon.authentication.staticTokenSecret.key }}
            {{- end }}
            {{- if $outputRegistrySecret }}
            - name: DOCKER_CONFIG
              value: /home/kova/.docker
            {{- end }}
          {{- end }}
          {{- if .Values.artifactStore.secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.artifactStore.secretName }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.serviceDaemon.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.serviceDaemon.securityContext | nindent 12 }}
          {{- if or (eq .Values.artifactStore.driver "filesystem") $outputRegistrySecret }}
          volumeMounts:
            {{- if eq .Values.artifactStore.driver "filesystem" }}
            - name: kova-source-store
              mountPath: {{ .Values.artifactStore.filesystem.mountPath }}
            {{- end }}
            {{- if $outputRegistrySecret }}
            - name: registry-credentials
              mountPath: /home/kova/.docker
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $imagePullSecrets := include "kova.renderImagePullSecrets" . }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq .Values.artifactStore.driver "filesystem") $outputRegistrySecret }}
      volumes:
        {{- if eq .Values.artifactStore.driver "filesystem" }}
        - name: kova-source-store
          persistentVolumeClaim:
            claimName: {{ include "kova.sourcePVCName" . }}
        {{- end }}
        {{- if $outputRegistrySecret }}
        - name: registry-credentials
          secret:
            secretName: {{ $outputRegistrySecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
      {{- end }}
{{- end }}
