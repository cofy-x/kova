{{- if .Values.serviceDaemon.enabled }}
{{- if not .Values.serviceDaemon.admissionGenesis.enabled }}
{{- fail "serviceDaemon.enabled requires externally installed admission Genesis; legacy Service admission is not supported" }}
{{- end }}
{{- if not (has .Values.serviceDaemon.authentication.mode (list "tokenreview" "static" "unsafe-none")) }}
{{- fail "serviceDaemon.authentication.mode must be tokenreview, static, or unsafe-none" }}
{{- end }}
{{- if lt (int .Values.serviceDaemon.kubeClientBurst) (int .Values.serviceDaemon.kubeClientQPS) }}
{{- fail "serviceDaemon.kubeClientBurst must be at least serviceDaemon.kubeClientQPS" }}
{{- end }}
{{- if not .Values.serviceDaemon.runnerNamespace }}
{{- fail "serviceDaemon.admissionGenesis requires an explicit fresh runnerNamespace" }}
{{- end }}
{{- if not .Values.serviceDaemon.workerPoolID }}
{{- fail "serviceDaemon requires the externally assigned workerPoolID from the Genesis contract" }}
{{- end }}
{{- if not .Values.images.runner.digest }}
{{- fail "serviceDaemon requires images.runner.digest pinned to the OCI manifest in the Genesis contract" }}
{{- end }}
{{- if not .Values.serviceDaemon.admissionGenesis.recoveryReceiptNamespace }}
{{- fail "serviceDaemon.admissionGenesis requires an explicit fresh recoveryReceiptNamespace" }}
{{- end }}
{{- if or (eq .Values.serviceDaemon.admissionGenesis.recoveryReceiptNamespace .Values.serviceDaemon.runnerNamespace) (eq .Values.serviceDaemon.admissionGenesis.recoveryReceiptNamespace (include "kova.namespace" .)) }}
{{- fail "recoveryReceiptNamespace must differ from runner and Service namespaces" }}
{{- end }}
{{- if not .Values.serviceDaemon.admissionGenesis.receiptSecret.name }}
{{- fail "serviceDaemon.admissionGenesis requires the external immutable receipt Secret name" }}
{{- end }}
{{- if not .Values.serviceDaemon.admissionGenesis.receiptSecret.uid }}
{{- fail "serviceDaemon.admissionGenesis requires the original immutable receipt Secret UID" }}
{{- end }}
{{- if ne .Values.serviceDaemon.metricsBindAddress "0" }}
{{- $metricsPort := int (last (splitList ":" .Values.serviceDaemon.metricsBindAddress)) }}
{{- if or (lt $metricsPort 1) (gt $metricsPort 65535) (eq $metricsPort (int (last (splitList ":" .Values.serviceDaemon.listen)))) }}
{{- fail "serviceDaemon.metricsBindAddress must use a valid port distinct from serviceDaemon.listen" }}
{{- end }}
{{- end }}
{{- $name := printf "%s-service" (include "kova.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $selectorName := printf "%s-service" (include "kova.name" .) | trunc 63 | trimSuffix "-" }}
{{- $saName := default "default" .Values.serviceDaemon.serviceAccount.name }}
{{- if .Values.serviceDaemon.serviceAccount.create }}
{{- $saName = default $name .Values.serviceDaemon.serviceAccount.name }}
{{- end }}
{{- $runnerRegistrySecret := default (include "kova.imagePullSecretName" .) .Values.serviceDaemon.runnerImagePullSecret }}
{{- $outputRegistrySecret := default $runnerRegistrySecret .Values.serviceDaemon.registrySecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "kova.namespace" . }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.serviceDaemon.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ $selectorName }}
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ $selectorName }}
        app.kubernetes.io/component: service
        {{- with .Values.serviceDaemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.serviceDaemon.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceDaemon.serviceAccount.automountServiceAccountToken }}
      serviceAccountName: {{ $saName }}
      securityContext:
        {{- toYaml .Values.serviceDaemon.podSecurityContext | nindent 8 }}
      containers:
        - name: kova-service
          image: {{ include "kova.roleImage" (dict "root" . "role" "controller") | quote }}
          imagePullPolicy: {{ include "kova.roleImagePullPolicy" (dict "root" . "role" "controller") }}
          args:
            - --listen={{ .Values.serviceDaemon.listen }}
            - --namespace={{ default (include "kova.namespace" .) .Values.serviceDaemon.runnerNamespace }}
            - --recovery-receipt-namespace={{ .Values.serviceDaemon.admissionGenesis.recoveryReceiptNamespace }}
            - --worker-pool-id={{ .Values.serviceDaemon.workerPoolID }}
            - --runner-image={{ include "kova.roleImage" (dict "root" . "role" "runner") }}
            - --runner-image-pull-policy={{ include "kova.roleImagePullPolicy" (dict "root" . "role" "runner") }}
            - --runner-image-pull-secret={{ $runnerRegistrySecret }}
            - {{ printf "--runner-resources=%s" (toJson .Values.serviceDaemon.runnerResources) | quote }}
            - {{ printf "--source-fetch-resources=%s" (toJson .Values.serviceDaemon.sourceFetchResources) | quote }}
            - --source-volume-size-limit={{ .Values.serviceDaemon.sourceVolumeSizeLimit }}
            {{- range $key, $value := .Values.serviceDaemon.runnerNodeSelector }}
            - {{ printf "--runner-node-selector=%s=%s" $key ($value | toString) | quote }}
            {{- end }}
            {{- range .Values.serviceDaemon.registryPlainHTTP }}
            - {{ printf "--registry-plain-http=%s" . | quote }}
            {{- end }}
            {{- if .Values.serviceDaemon.buildkitPlatformAddrs }}
            {{- range $platform, $address := .Values.serviceDaemon.buildkitPlatformAddrs }}
            - {{ printf "--buildkit-platform-addr=%s=%s" $platform $address | quote }}
            {{- end }}
            {{- else }}
            - {{ printf "--buildkit-platform-addr=%s=tcp://%s.%s.svc:%v" .Values.worker.platform (include "kova.fullname" .) (include "kova.namespace" .) .Values.service.port | quote }}
            {{- end }}
            - --auth-mode={{ .Values.serviceDaemon.authentication.mode }}
            - --auth-static-principal={{ .Values.serviceDaemon.authentication.staticPrincipal }}
            - --job-ttl={{ .Values.serviceDaemon.jobTTL }}
            - --wait={{ .Values.serviceDaemon.wait }}
            - --poll-interval={{ .Values.serviceDaemon.pollInterval }}
            - --poll-retry-window={{ .Values.serviceDaemon.pollRetryWindow }}
            - --max-build-duration={{ .Values.serviceDaemon.maxBuildDuration }}
            - --verification-attempt-timeout={{ .Values.serviceDaemon.verificationAttemptTimeout }}
            - --verification-window={{ .Values.serviceDaemon.verificationWindow }}
            - --max-active-jobs={{ .Values.serviceDaemon.maxActiveJobs }}
            - --max-active-jobs-per-requester={{ .Values.serviceDaemon.maxActiveJobsPerRequester }}
            - --max-queued-jobs={{ .Values.serviceDaemon.maxQueuedJobs }}
            - --max-queued-jobs-per-requester={{ .Values.serviceDaemon.maxQueuedJobsPerRequester }}
            - --worker-slots={{ .Values.serviceDaemon.workerSlots }}
            - --controller-concurrency={{ .Values.serviceDaemon.controllerConcurrency }}
            - --kube-client-qps={{ .Values.serviceDaemon.kubeClientQPS }}
            - --kube-client-burst={{ .Values.serviceDaemon.kubeClientBurst }}
            - --metrics-bind-address={{ .Values.serviceDaemon.metricsBindAddress }}
            - --leader-elect={{ .Values.serviceDaemon.leaderElect }}
            - --leader-election-namespace={{ include "kova.namespace" . }}
            {{- if .Values.serviceDaemon.admissionGenesis.enabled }}
            - --admission-genesis-receipt-file=/etc/kova/admission-genesis/receipt.json
            - --admission-genesis-receipt-secret-namespace={{ include "kova.namespace" . }}
            - --admission-genesis-receipt-secret-name={{ .Values.serviceDaemon.admissionGenesis.receiptSecret.name }}
            - --admission-genesis-receipt-secret-uid={{ .Values.serviceDaemon.admissionGenesis.receiptSecret.uid }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serviceDaemon.port }}
              protocol: TCP
          {{- if or .Values.observability.enabled (eq .Values.serviceDaemon.authentication.mode "static") $outputRegistrySecret }}
          env:
            {{- if .Values.observability.enabled }}
            {{- include "kova.observabilityEnv" . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.serviceDaemon.authentication.mode "static" }}
            - name: KOVA_SERVICE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "serviceDaemon.authentication.staticTokenSecret.name is required for static authentication" .Values.serviceDaemon.authentication.staticTokenSecret.name }}
                  key: {{ .Values.serviceDaemon.authentication.staticTokenSecret.key }}
            {{- end }}
            {{- if $outputRegistrySecret }}
            - name: DOCKER_CONFIG
              value: /home/kova/.docker
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.serviceDaemon.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.serviceDaemon.securityContext | nindent 12 }}
          {{- if or $outputRegistrySecret .Values.serviceDaemon.admissionGenesis.enabled }}
          volumeMounts:
            {{- if .Values.serviceDaemon.admissionGenesis.enabled }}
            - name: admission-genesis-receipt
              mountPath: /etc/kova/admission-genesis
              readOnly: true
            {{- end }}
            {{- if $outputRegistrySecret }}
            - name: registry-credentials
              mountPath: /home/kova/.docker
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $imagePullSecrets := include "kova.renderImagePullSecrets" . }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceDaemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $outputRegistrySecret .Values.serviceDaemon.admissionGenesis.enabled }}
      volumes:
        {{- if .Values.serviceDaemon.admissionGenesis.enabled }}
        - name: admission-genesis-receipt
          secret:
            secretName: {{ .Values.serviceDaemon.admissionGenesis.receiptSecret.name }}
            optional: false
            items:
              - key: receipt.json
                path: receipt.json
        {{- end }}
        {{- if $outputRegistrySecret }}
        - name: registry-credentials
          secret:
            secretName: {{ $outputRegistrySecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
      {{- end }}
{{- end }}
