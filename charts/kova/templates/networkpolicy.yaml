{{- if .Values.networkPolicy.worker.enabled }}
{{- $serviceNamespace := include "kova.namespace" . }}
{{- $runnerNamespace := default $serviceNamespace .Values.serviceDaemon.runnerNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kova.fullname" . }}-worker
  namespace: {{ include "kova.namespace" . }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kova.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $runnerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kova-runner
        {{- with .Values.networkPolicy.worker.additionalIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.worker.port }}
          protocol: {{ .Values.worker.protocol }}
{{- end }}
{{- if and .Values.serviceDaemon.enabled .Values.networkPolicy.service.enabled }}
---
{{- $selectorName := printf "%s-service" (include "kova.name" .) | trunc 63 | trimSuffix "-" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kova.fullname" . }}-service
  namespace: {{ include "kova.namespace" . }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ $selectorName }}
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.service.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.service.ingressFrom | nindent 8 }}
      ports:
        - port: {{ .Values.serviceDaemon.port }}
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
