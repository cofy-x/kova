{{- if .Values.serviceDaemon.enabled }}
{{- $name := printf "%s-service" (include "kova.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $serviceNamespace := include "kova.namespace" . }}
{{- $runnerNamespace := default $serviceNamespace .Values.serviceDaemon.runnerNamespace }}
{{- $saName := default "default" .Values.serviceDaemon.serviceAccount.name }}
{{- if .Values.serviceDaemon.serviceAccount.create }}
{{- $saName = default $name .Values.serviceDaemon.serviceAccount.name }}
{{- end }}
{{- if .Values.serviceDaemon.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $serviceNamespace }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
  {{- with .Values.serviceDaemon.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceDaemon.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $runnerNamespace }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["kova.cofy.dev"]
    resources: ["kovabuilds"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["kova.cofy.dev"]
    resources: ["kovabuilds/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["kova.cofy.dev"]
    resources: ["kovabuilds/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $runnerNamespace }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $serviceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ $serviceNamespace }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ $serviceNamespace }}
  labels:
    {{- include "kova.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $serviceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-election
{{- if eq .Values.serviceDaemon.authentication.mode "tokenreview" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-tokenreview
  labels:
    {{- include "kova.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-tokenreview
  labels:
    {{- include "kova.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $serviceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-tokenreview
{{- end }}
{{- end }}
