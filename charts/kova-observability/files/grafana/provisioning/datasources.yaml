apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://{{ include "kova-observability.componentName" (dict "root" . "component" "prometheus") }}:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://{{ include "kova-observability.componentName" (dict "root" . "component" "tempo") }}:3200
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://{{ include "kova-observability.componentName" (dict "root" . "component" "loki") }}:3100
    editable: false
