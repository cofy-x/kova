apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo") }}
  labels:
    {{- include "kova-observability.labels" (dict "root" . "component" "tempo") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "kova-observability.selectorLabels" (dict "root" . "component" "tempo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kova-observability.selectorLabels" (dict "root" . "component" "tempo") | nindent 8 }}
      annotations: {checksum/config: {{ include (print $.Template.BasePath "/tempo-config.yaml") . | sha256sum }}}
    spec:
      {{- include "kova-observability.podScheduling" (dict "root" . "component" "tempo") | nindent 6 }}
      securityContext: {fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: tempo
          image: {{ include "kova-observability.image" .Values.tempo.image | quote }}
          imagePullPolicy: {{ .Values.tempo.image.pullPolicy }}
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /ready, port: http}}
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo-config") }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo") }}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo") }}}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.tempo.persistence.size }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo") }}
  labels:
    {{- include "kova-observability.labels" (dict "root" . "component" "tempo") | nindent 4 }}
spec:
  selector:
    {{- include "kova-observability.selectorLabels" (dict "root" . "component" "tempo") | nindent 4 }}
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
