apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kova-observability.componentName" (dict "root" . "component" "tempo-config") }}
  labels:
    {{- include "kova-observability.labels" (dict "root" . "component" "tempo") | nindent 4 }}
data:
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
            http: {endpoint: 0.0.0.0:4318}
    ingester: {max_block_duration: 5m}
    compactor: {compaction: {block_retention: {{ .Values.tempo.retention }}}}
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
