nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

storageClassName: ""

collector:
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.150.1
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  persistence:
    size: 20Gi
  memoryLimiter:
    limitMiB: 768
    spikeLimitMiB: 192

prometheus:
  image:
    repository: prom/prometheus
    tag: v3.12.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}
  retention: 15d
  persistence:
    size: 50Gi

tempo:
  image:
    repository: grafana/tempo
    tag: 2.10.5
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  retention: 168h
  persistence:
    size: 30Gi

loki:
  image:
    repository: grafana/loki
    tag: 3.7.2
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  retention: 168h
  persistence:
    size: 30Gi

grafana:
  image:
    repository: grafana/grafana
    tag: 13.0.2
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  persistence:
    size: 20Gi
  admin:
    existingSecret: ""
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
    annotations: {}
