name: Bug report
description: Report a reproducible problem in Kova
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Kova. Do not include credentials or private vulnerability details.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence, with sensitive values removed.
      placeholder: |
        1. Deploy Kova with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kova version
      placeholder: Commit SHA, tag, or image digest
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Kubernetes, BuildKit, container runtime, architecture, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste concise, redacted logs or diagnostics.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, tokens, registry passwords, and other sensitive data.
          required: true
