name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check out release guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate semantic version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "release tag must be a semantic version such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

          prerelease="${BASH_REMATCH[5]:-}"
          if [[ -n "${prerelease}" ]]; then
            if [[ "${prerelease}" == .* || "${prerelease}" == *. || "${prerelease}" == *..* ]]; then
              echo "release tag contains an invalid prerelease identifier" >&2
              exit 1
            fi
            IFS=. read -ra identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/guard-release-version.sh "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"

  cli:
    name: CLI artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI archives
        run: scripts/release/build-cli.sh "${GITHUB_REF_NAME}"
      - name: Verify tagged Go SDK and go install
        run: scripts/ci/public-go-consumer.sh "${GITHUB_REF_NAME}"
      - name: Generate CLI SBOM
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -tags=netgo,osusergo
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            app -json -output "dist/kova_${GITHUB_REF_NAME#v}.cdx.json" \
            -main cmd/kova .
      - name: Attest CLI artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload CLI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-assets
          path: dist/*
          if-no-files-found: error

  python-sdk:
    name: Python SDK artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Build and validate Python package
        env:
          KOVA_EXPECTED_VERSION: ${{ github.ref_name }}
        run: scripts/ci/python-sdk.sh dist/python
      - name: Attest Python package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/python/*
      - name: Upload Python package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdk-assets
          path: dist/python/*
          if-no-files-found: error

  publish-python-sdk:
    name: Publish Python SDK
    needs:
      - python-sdk
      - candidate-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/kova-client
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publication guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Download Python package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-assets
          path: dist
      - name: Reject mismatched existing PyPI files before upload
        run: python scripts/release/verify-pypi-artifacts.py dist --preflight
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  chart:
    name: Helm chart candidate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Package Helm chart
        run: scripts/release/package-chart.sh "${GITHUB_REF_NAME}"
      - name: Attest Helm chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kova-*.tgz
      - name: Upload Helm chart candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-candidate
          path: dist/*
          if-no-files-found: error

  image:
    name: Image candidates
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      controller_digest: ${{ steps.digests.outputs.controller_digest }}
      runner_digest: ${{ steps.digests.outputs.runner_digest }}
      worker_digest: ${{ steps.digests.outputs.worker_digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: echo "build_date=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build and publish candidate images
        shell: bash
        run: |
          mkdir -p dist
          docker buildx bake images --push --provenance=mode=max --sbom=true \
            --metadata-file dist/candidate-images.json \
            --var "KOVA_IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY}" \
            --var "KOVA_IMAGE_TAG_SUFFIX=candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --var "KOVA_VERSION=${GITHUB_REF_NAME}" \
            --var "KOVA_COMMIT=${GITHUB_SHA}" \
            --var "KOVA_BUILD_DATE=${{ steps.metadata.outputs.build_date }}" \
            --set 'controller.cache-from=type=gha,scope=kova-controller' \
            --set 'controller.cache-to=type=gha,mode=max,scope=kova-controller' \
            --set 'runner.cache-from=type=gha,scope=kova-runner' \
            --set 'runner.cache-to=type=gha,mode=max,scope=kova-runner' \
            --set 'worker.cache-from=type=gha,scope=kova-worker' \
            --set 'worker.cache-to=type=gha,mode=max,scope=kova-worker'
      - name: Capture immutable candidate digests
        id: digests
        run: scripts/release/capture-image-digests.sh dist/candidate-images.json >> "${GITHUB_OUTPUT}"
      - name: Upload candidate image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-evidence
          path: dist/candidate-images.json
          if-no-files-found: error

  candidate-smoke:
    name: Candidate Service and upgrade smoke
    needs:
      - cli
      - chart
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Download CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-assets
          path: dist
      - name: Download chart candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-candidate
          path: dist
      - name: Prepare candidate and baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p dist/cli dist/baseline
          tar -xzf "dist/kova_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C dist/cli kova LICENSE
          dist/cli/kova version | grep -F "${GITHUB_REF_NAME}"
          cp "dist/kova-${GITHUB_REF_NAME#v}.tgz" dist/kova-candidate.tgz
          baseline_tag=$(gh release list --repo "${GITHUB_REPOSITORY}" \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "${baseline_tag}" ]]; then
            baseline_version="${baseline_tag#v}"
            helm pull "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova" \
              --version "${baseline_version}" \
              --destination dist/baseline
            cp "dist/baseline/kova-${baseline_version}.tgz" dist/baseline.tgz
            baseline_crds=$(helm show crds dist/baseline.tgz)
            if [[ "${baseline_crds}" != *'name: kovabuilds.kova.cofy.dev'* ]]; then
              echo 'baseline chart lacks the KovaBuild CRD; refusing an unverified upgrade' >&2
              exit 1
            fi
            {
              printf 'BASELINE_CHART=%s/dist/baseline.tgz\n' "${GITHUB_WORKSPACE}"
              printf 'BASELINE_VALUES=%s/deploy/crd-upgrade-baseline-values.yaml\n' "${GITHUB_WORKSPACE}"
              printf 'SERVICE_RUNNER_NAMESPACE=kova-release-upgraded\n'
              if [[ "${baseline_crds}" != *'pollFailureSince:'* ]]; then
                # Older releases need the explicit pruning and late-runner fixture.
                printf 'REQUIRE_LEGACY_CRD=true\n'
              fi
              printf 'BASELINE_CONTROLLER_IMAGE=ghcr.io/%s:controller-%s\n' "${GITHUB_REPOSITORY}" "${baseline_tag}"
              printf 'BASELINE_RUNNER_IMAGE=ghcr.io/%s:runner-%s\n' "${GITHUB_REPOSITORY}" "${baseline_tag}"
              printf 'BASELINE_WORKER_IMAGE=ghcr.io/%s:worker-%s\n' "${GITHUB_REPOSITORY}" "${baseline_tag}"
            } >> "${GITHUB_ENV}"
          fi
      - name: Run candidate Service lifecycle
        env:
          CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.controller_digest }}
          RUNNER_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.runner_digest }}
          WORKER_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.worker_digest }}
          KOVA_CHART: ${{ github.workspace }}/dist/kova-candidate.tgz
          KOVA_CLI: ${{ github.workspace }}/dist/cli/kova
          E2E_SERVICE_BUILD_CLI: "false"
          E2E_SERVICE_BUILD_IMAGE: "false"
          KIND_LOAD_IMAGES: "false"
          START_OBSERVABILITY: "false"
          KIND_CLUSTER: kova-release-smoke
          KIND_CONFIG: deploy/quickstart-kind-cluster.yaml
          KIND_KUBECONFIG: .kind/kova-release-smoke.kubeconfig
          KIND_WORKERS: "1"
          KIND_VALUES: deploy/quickstart-kind-values.yaml
          KOVA_VALUES: ${{ github.workspace }}/deploy/quickstart-kind-values.yaml
        run: scripts/e2e/e2e-service.sh

  publish-image:
    name: Publish ${{ matrix.role }} image
    needs: [candidate-smoke, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role:
          - controller
          - runner
          - worker
    steps:
      - name: Check out publication guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote validated image digest
        env:
          CANDIDATE_DIGEST: ${{ needs.image.outputs[format('{0}_digest', matrix.role)] }}
        shell: bash
        run: |
          if [[ ! "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "validated candidate digest is missing or invalid" >&2
            exit 1
          fi
          source="ghcr.io/${GITHUB_REPOSITORY}@${CANDIDATE_DIGEST}"
          scripts/release/guard-image-version.sh "ghcr.io/${GITHUB_REPOSITORY}:${{ matrix.role }}-${GITHUB_REF_NAME}" "${CANDIDATE_DIGEST}"
          args=(--tag "ghcr.io/${GITHUB_REPOSITORY}:${{ matrix.role }}-${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            args+=(--tag "ghcr.io/${GITHUB_REPOSITORY}:${{ matrix.role }}-latest")
          fi
          docker buildx imagetools create "${args[@]}" "${source}"
          actual=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:${{ matrix.role }}-${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)
          test "${actual}" = "${CANDIDATE_DIGEST}"

  publish-chart:
    name: Publish Helm chart
    needs: candidate-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Download chart candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-candidate
          path: dist
      - name: Log in to GitHub Container Registry
        env:
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "${HELM_PASSWORD}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
      - name: Publish validated chart
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Version tags are immutable across attempts. A partial release may
          # resume only if an already-pushed chart matches this validated file.
          mkdir -p existing-chart
          if helm pull "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova" --version "${version}" --destination existing-chart >existing-chart/pull.log 2>&1; then
            cmp "dist/kova-${version}.tgz" "existing-chart/kova-${version}.tgz"
          elif ! grep -Fq "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova:${version}: not found" existing-chart/pull.log; then
            echo 'cannot establish existing chart identity; refusing publication' >&2
            exit 1
          fi
          output=$(helm push "dist/kova-${version}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts" 2>&1)
          printf '%s\n' "${output}"
          digest=$(printf '%s\n' "${output}" | awk '/^Digest: sha256:/ {print $2}')
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "published chart did not return an OCI digest" >&2
            exit 1
          fi
          printf 'oci://ghcr.io/%s/charts/kova@%s\n' \
            "${GITHUB_REPOSITORY_OWNER}" "${digest}" \
            >"dist/kova_${version}.chart-digest.txt"
      - name: Upload published chart assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-assets
          path: dist/*
          if-no-files-found: error
      - name: Log out of GitHub Container Registry
        if: always()
        run: helm registry logout ghcr.io || true

  assets:
    name: Release assets
    needs:
      - cli
      - publish-python-sdk
      - publish-chart
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-assets
          path: dist
      - name: Download Helm chart assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-assets
          path: dist
      - name: Download Python SDK assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-assets
          path: dist
      - name: Download candidate image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-candidate-evidence
          path: dist
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          mapfile -d '' artifacts < <(
            find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z
          )
          sha256sum "${artifacts[@]}" > checksums.txt
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  published-smoke:
    name: Published artifact smoke
    needs:
      - assets
      - publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out artifact verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify CLI archives and native binary
        shell: bash
        run: |
          cd dist
          sha256sum --check checksums.txt
          archive="kova_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz"
          tar -tzf "${archive}" | grep -qx LICENSE
          tar -xzf "${archive}" kova LICENSE
          ./kova version | grep -F "${GITHUB_REF_NAME}"
      - name: Verify public Python SDK hashes and installation
        timeout-minutes: 7
        shell: bash
        run: |
          sdk_version=$(python scripts/release/verify-pypi-artifacts.py dist --visibility-deadline-seconds 300)
          python -m venv installed-sdk
          installed-sdk/bin/python -m pip install --index-url https://pypi.org/simple "kova-client==${sdk_version}"
          EXPECTED_SDK_VERSION="${sdk_version}" installed-sdk/bin/python -c 'import importlib.metadata, os; from kova_client import AsyncKovaClient, KovaClient; assert AsyncKovaClient and KovaClient; assert importlib.metadata.version("kova-client") == os.environ["EXPECTED_SDK_VERSION"]'
      - name: Verify public Helm chart
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir pulled
          helm registry logout ghcr.io >/dev/null 2>&1 || true
          pulled_chart=false
          for _ in {1..6}; do
            if helm pull "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova" \
              --version "${version}" --destination pulled; then
              pulled_chart=true
              break
            fi
            sleep 5
          done
          if [[ "${pulled_chart}" != true ]]; then
            echo "published Helm chart is not anonymously pullable" >&2
            exit 1
          fi
          cmp "dist/kova-${version}.tgz" "pulled/kova-${version}.tgz"
          helm show chart "pulled/kova-${version}.tgz" \
            | grep -Fx "version: ${version}" >/dev/null
          helm show chart "pulled/kova-${version}.tgz" \
            | grep -Fx "appVersion: ${GITHUB_REF_NAME}" >/dev/null
      - name: Verify public role images and boundaries
        shell: bash
        run: |
          for role in controller runner worker; do
            image="ghcr.io/${GITHUB_REPOSITORY}:${role}-${GITHUB_REF_NAME}"
            expected=$(jq -er --arg role "${role}" '.[$role]["containerimage.digest"]' dist/candidate-images.json)
            actual=$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}' | jq -r .digest)
            test "${actual}" = "${expected}"
            pulled_image=false
            for _ in {1..6}; do
              if docker pull "${image}"; then
                pulled_image=true
                break
              fi
              sleep 5
            done
            if [[ "${pulled_image}" != true ]]; then
              echo "${image} is not anonymously pullable" >&2
              exit 1
            fi
          done
          docker run --rm --entrypoint sh "ghcr.io/${GITHUB_REPOSITORY}:controller-${GITHUB_REF_NAME}" -c 'test "$(id -u)" = 65532; command -v kova-controller; ! command -v kovad; ! command -v buildkitd'
          docker run --rm --entrypoint sh "ghcr.io/${GITHUB_REPOSITORY}:runner-${GITHUB_REF_NAME}" -c 'test "$(id -u)" = 65532; command -v kovad; command -v buildctl; ! command -v buildkitd'
          docker run --rm --entrypoint sh "ghcr.io/${GITHUB_REPOSITORY}:worker-${GITHUB_REF_NAME}" -c 'test "$(id -u)" = 1000; command -v buildkitd; command -v rootlesskit; ! command -v kovad'
          docker run --rm --entrypoint kova-controller "ghcr.io/${GITHUB_REPOSITORY}:controller-${GITHUB_REF_NAME}" version | grep -F "${GITHUB_REF_NAME}"
          docker run --rm --entrypoint kovad "ghcr.io/${GITHUB_REPOSITORY}:runner-${GITHUB_REF_NAME}" version | grep -F "${GITHUB_REF_NAME}"
          test "$(docker image inspect "ghcr.io/${GITHUB_REPOSITORY}:worker-${GITHUB_REF_NAME}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "${GITHUB_REF_NAME}"

  release:
    name: GitHub release
    needs:
      - assets
      - published-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify checksums
        run: |
          cd dist
          sha256sum --check checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          read -r -d '' introduction <<EOF || true
          Kova ${GITHUB_REF_NAME} publishes one matched release set:

          - CLI archives
          - Python SDK: https://pypi.org/project/kova-client/
          - OCI chart: oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova
          - controller, runner, and worker images

          Fresh install (enable Service and authentication in your reviewed values):

              export KOVA_VERSION=${GITHUB_REF_NAME}
              helm show crds oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova --version "\${KOVA_VERSION#v}" | kubectl apply -f -
              helm install kova oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/kova --version "\${KOVA_VERSION#v}" --namespace kova --create-namespace --values your-reviewed-values.yaml --wait

          Verify downloaded assets with checksums.txt. Apply the selected
          release CRDs before every Helm upgrade because Helm does not upgrade CRDs
          from a chart's crds/ directory.

          Existing installations: do NOT perform a live rolling upgrade from
          rc.9. Stop submissions, drain and confirm all active builds/runner Pods
          are gone, back up ledgers and receipts, apply and round-trip the new
          CRD status fields, select a fresh runner namespace for the new admission
          contract, then upgrade all three roles together. Never delete a ledger
          to reset capacity. Follow docs/service.md and docs/releases.md at this tag.
          EOF
          notes_file=$(mktemp)
          printf '%s\n' "${introduction}" > "${notes_file}"
          if [[ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]]; then
            printf '\n' >> "${notes_file}"
            cat "docs/release-notes/${GITHUB_REF_NAME}.md" >> "${notes_file}"
          fi
          args=(
            release create "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
            --notes-file "${notes_file}"
            --title "${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" dist/*
