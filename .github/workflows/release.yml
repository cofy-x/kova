name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Validate semantic version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "release tag must be a semantic version such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          prerelease="${BASH_REMATCH[5]:-}"
          if [[ -n "${prerelease}" ]]; then
            if [[ "${prerelease}" == .* || "${prerelease}" == *. || "${prerelease}" == *..* ]]; then
              echo "release tag contains an invalid prerelease identifier" >&2
              exit 1
            fi
            IFS=. read -ra identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi

  cli:
    name: CLI artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI archives
        run: scripts/release/build-cli.sh "${GITHUB_REF_NAME}"
      - name: Generate CLI SBOM
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -tags=netgo,osusergo
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            app -json -output "dist/kova_${GITHUB_REF_NAME#v}.cdx.json" \
            -main cmd/kova .
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          mapfile -d '' artifacts < <(
            find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z
          )
          sha256sum "${artifacts[@]}" > checksums.txt
      - name: Attest CLI artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  image:
    name: Runtime image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
            echo "build_date=$(git show -s --format=%cI HEAD)"
          } >> "${GITHUB_OUTPUT}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=kova-runtime
          cache-to: type=gha,mode=max,scope=kova-runtime

  release:
    name: GitHub release
    needs:
      - cli
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify checksums
        run: |
          cd dist
          sha256sum --check checksums.txt
      - name: Verify runtime image is public
        shell: bash
        run: |
          for attempt in {1..5}; do
            if docker pull "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if (( attempt < 5 )); then
              sleep 5
            fi
          done
          echo "runtime image is not anonymously pullable" >&2
          exit 1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
            --title "${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" dist/*
