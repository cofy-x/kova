name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install LMDB development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblmdb-dev
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check module files
        run: go mod tidy -diff
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detection
        run: go test -race ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Verify generated CRDs
        run: |
          make generate-crds
          git diff --exit-code -- charts/kova/crds
      - name: Verify CLI dependency boundary
        shell: bash
        run: |
          runtime_dependencies="$(
            go list -deps ./cmd/kova \
              | grep -E '^github.com/cofy-x/kova/internal/(batch|daemon|service|store)(/.*)?$' \
              || true
          )"
          if [[ -n "${runtime_dependencies}" ]]; then
            printf 'kova CLI must not link runtime packages:\n%s\n' "${runtime_dependencies}" >&2
            exit 1
          fi
      - name: Verify cross-platform CLI builds
        shell: bash
        run: |
          pids=()
          failed=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -o "/tmp/kova-${target//\//-}" ./cmd/kova &
            pids+=("$!")
            if (( ${#pids[@]} == 2 )); then
              for pid in "${pids[@]}"; do
                wait "${pid}" || failed=1
              done
              pids=()
            fi
          done
          for pid in "${pids[@]}"; do
            wait "${pid}" || failed=1
          done
          exit "${failed}"

  manifests:
    name: Scripts and charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Check shell scripts
        run: make lint-scripts
      - name: Check documentation links
        run: make docs-check
      - name: Lint Helm charts
        run: |
          helm lint charts/kova --values deploy/kind-values.yaml
          helm lint charts/kova-observability --set grafana.admin.existingSecret=test-secret
      - name: Render Helm charts
        run: make helm-template

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Build and verify role images
        shell: bash
        run: |
          for role in controller runner worker; do
            docker build --platform linux/amd64 --target "${role}" \
              --tag "localhost:5002/kova:${role}-dev" \
              --file docker/Dockerfile .
          done
          docker run --rm --entrypoint sh localhost:5002/kova:controller-dev -c 'test "$(id -u)" = 65532; command -v kova-controller; ! command -v kovad; ! command -v buildkitd'
          docker run --rm --entrypoint sh localhost:5002/kova:runner-dev -c 'test "$(id -u)" = 65532; command -v kovad; command -v buildctl; ! command -v buildkitd'
          docker run --rm --entrypoint sh localhost:5002/kova:worker-dev -c 'test "$(id -u)" = 1000; command -v buildkitd; command -v rootlesskit; ! command -v kovad'
      - name: Verify packaged Helm quickstart
        env:
          E2E_BUILD_IMAGE: "false"
        run: make e2e-helm-quickstart
      - name: Verify S3 Service lifecycle
        env:
          E2E_SERVICE_BUILD_CLI: "false"
          E2E_SERVICE_BUILD_IMAGE: "false"
          KIND_LOAD_IMAGES: "false"
          START_OBSERVABILITY: "false"
        run: make e2e-service-s3
